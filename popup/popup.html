<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic EQ Reply</title>
  <!-- Google Product Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Text:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
  <script src="../lib/chrome_shim.js"></script>
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="brand-row">
        <img src="../lib/icons/icon32.png" alt="Logo" class="popup-logo">
        <div>
          <h1 class="popup-title">Agentic EQ Reply</h1>
          <span class="popup-subtitle">Managerial Intelligence Assistant</span>
        </div>
      </div>
      <div id="popupModeBadge" class="mode-pill pill-local">
        <span class="mode-dot"></span>
        <span id="popupModeLabel">Local Fallback</span>
      </div>
    </header>

    <!-- Fallback Insistence Banner -->
    <div id="popupFallbackBanner" class="popup-callout" style="display:none;">
      <p class="callout-msg">You're on local fallback. Connect an agent for better research, accuracy, and QA-verified replies.</p>
      <button id="popupConnectAgentBtn" class="btn btn-sm btn-accent">Connect Agent</button>
    </div>

    <div class="quick-actions">
      <button id="btnOpenSidepanelPrimary" class="btn btn-primary btn-block">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
        </svg>
        <span>Open Side Panel (Primary Workspace)</span>
      </button>

      <button id="btnDraftFromSelection" class="btn btn-secondary btn-block">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
        </svg>
        <span>Draft Reply from Selection</span>
      </button>
    </div>

    <!-- Mini Telemetry HUD -->
    <div class="hud-stats">
      <div class="hud-card">
        <span class="hud-label">QA Pass</span>
        <span class="hud-val text-green" id="hudPassRate">100%</span>
      </div>
      <div class="hud-card">
        <span class="hud-label">Avg QA</span>
        <span class="hud-val text-gold" id="hudAvgScore">96/100</span>
      </div>
      <div class="hud-card">
        <span class="hud-label">Corpus</span>
        <span class="hud-val text-teal">36 Chunks</span>
      </div>
    </div>

    <footer class="popup-footer">
      <span>Managerial EQ Handbook Protocols</span>
      <a href="#" id="popupSettingsLink">Settings &rarr;</a>
    </footer>
  </div>

  <script src="../lib/agents/llm_client.js"></script>
  <script src="popup.js"></script>
</body>
</html>
